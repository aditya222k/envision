/* ============================================================
   AUDIO
   Everything is generated at runtime with Tone.js — no files.
   The musical material is here rather than in LESSON because it
   is the game's voice, not the lesson's content: swap the lesson
   and this score still fits.
   ============================================================ */

const SCALES = {
  minor: [0, 2, 3, 5, 7, 8, 10],
  major: [0, 2, 4, 5, 7, 9, 11]
};

/* One melody, written in scale degrees so the very same shape can be
   played in the minor of 1932 and the major of the New Deal.
   32 quarter-notes; null is a rest. */
const MELODY = [
   4, null,  3, null,   2, null, null,  1,
   0, null,  2, null,   1, null, null, null,
   4, null,  5, null,   4, null,  2, null,
   0, null, -2, null,   0, null, null, null
];
const BASS = [0, 0, 5, 6, 0, 3, 5, 4];     // one root per bar

const SCORE = {
  // pad "hollow" is root and fifth with no third — the bare sound of 1932
  act1: { scale: "minor", bpm: 60, root: 57, level: 0.34, pad: "hollow",
          drone: 0.085, wind: 0.055, toll: true },   // A3
  act2: { scale: "major", bpm: 76, root: 57, level: 0.44, pad: "full",
          drone: 0.03,  wind: 0.018, toll: false }
};

/**
 * A small Schroeder-style hall built only from native Web Audio nodes.
 * Tone's own Freeverb is made of comb filters that run on an AudioWorklet,
 * and AudioWorklet is unavailable outside a secure context — so it would be
 * silent on a file:// page, which is exactly how this game is opened.
 */
function makeHall(wet, damping) {
  const input = new Tone.Gain(1);
  const output = new Tone.Gain(1);
  input.connect(output);                       // dry path
  const wetBus = new Tone.Gain(wet).connect(output);
  // mutually prime delay times, so the tail does not ring on one pitch
  [0.0297, 0.0371, 0.0411, 0.0437].forEach(function (time, i) {
    const delay = new Tone.Delay(time, 1);
    const damp = new Tone.Filter(damping, "lowpass");
    const feedback = new Tone.Gain(0.76 - i * 0.02);
    input.connect(delay);
    delay.connect(damp);
    damp.connect(feedback);
    feedback.connect(delay);                   // the tail
    damp.connect(wetBus);
  });
  return { input: input, output: output };
}

/** scale degree -> midi note, with degrees running past either end */
function degToMidi(root, scale, deg) {
  const oct = Math.floor(deg / 7);
  let i = deg % 7;
  if (i < 0) i += 7;
  return root + oct * 12 + scale[i];
}
function midiName(m) { return Tone.Frequency(m, "midi").toNote(); }

const audio = {
  ready: false,
  started: false,
  musicMuted: false,
  voiceMuted: false,
  ducked: false,
  movement: null,      // "act1" | "act2"
  nodes: null,
  seq: null
};

/** Built once, after the first user gesture unlocks the audio context. */
async function initAudio() {
  if (audio.started) return audio.ready;
  audio.started = true;
  if (typeof Tone === "undefined") {
    console.warn("Tone.js did not load — running without sound.");
    return false;
  }
  try {
    await Tone.start();
  } catch (err) {
    console.warn("Could not start the audio context:", err);
    return false;
  }

  try {
    buildAudioGraph();
  } catch (err) {
    console.warn("Audio graph could not be built \u2014 playing silently:", err);
    audio.ready = false;
    return false;
  }
  return audio.ready;
}

function buildAudioGraph() {
  const out = new Tone.Gain(0.9).toDestination();

  // ---- music bus, ducked under narration ----
  const musicBus = new Tone.Gain(0).connect(out);
  const hall = makeHall(0.34, 1800);
  hall.output.connect(musicBus);

  const piano = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: "triangle" },
    envelope: { attack: 0.012, decay: 1.5, sustain: 0.06, release: 2.6 }
  }).connect(hall.input);
  piano.volume.value = -9;

  const bass = new Tone.Synth({
    oscillator: { type: "sine" },
    envelope: { attack: 0.05, decay: 1.8, sustain: 0.12, release: 2.2 }
  }).connect(hall.input);
  bass.volume.value = -13;

  const pad = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: "sine" },
    envelope: { attack: 1.4, decay: 2, sustain: 0.4, release: 3 }
  }).connect(hall.input);
  pad.volume.value = -24;

  const brass = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: "sawtooth" },
    envelope: { attack: 0.04, decay: 0.3, sustain: 0.55, release: 0.7 }
  });
  const brassTone = new Tone.Filter(1500, "lowpass").connect(hall.input);
  brass.connect(brassTone);
  brass.volume.value = -8;

  // ---- effects bus, independent of the music bed ----
  const sfxBus = new Tone.Gain(0.9).connect(out);
  const sfxHall = makeHall(0.16, 3000);
  sfxHall.output.connect(sfxBus);

  const bell = new Tone.Synth({
    oscillator: { type: "sine" },
    envelope: { attack: 0.002, decay: 0.28, sustain: 0, release: 0.3 }
  }).connect(sfxHall.input);
  bell.volume.value = -16;

  const chime = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: "sine" },
    envelope: { attack: 0.01, decay: 1.6, sustain: 0, release: 2.4 }
  }).connect(sfxHall.input);
  chime.volume.value = -18;

  const paper = new Tone.NoiseSynth({
    noise: { type: "white" },
    envelope: { attack: 0.012, decay: 0.2, sustain: 0 }
  });
  const paperTone = new Tone.Filter(2600, "highpass").connect(sfxBus);
  paper.connect(paperTone);
  paper.volume.value = -22;

  const knock = new Tone.MembraneSynth({
    pitchDecay: 0.03, octaves: 2,
    envelope: { attack: 0.001, decay: 0.22, sustain: 0 }
  }).connect(sfxHall.input);
  knock.volume.value = -4;

  // a heavier slap to go with the membrane thud, so a knock is a bang
  const bang = new Tone.NoiseSynth({
    noise: { type: "brown" },
    envelope: { attack: 0.001, decay: 0.1, sustain: 0 }
  });
  const bangTone = new Tone.Filter({ type: "bandpass", frequency: 520, Q: 1.1 }).connect(sfxHall.input);
  bang.connect(bangTone);
  bang.volume.value = -7;

  /* ---- ambience: continuous beds the room turns on and off ---- */
  const ambBus = new Tone.Gain(1).connect(out);

  function bed(type, filterOpts) {
    const src = new Tone.Noise(type);
    const filt = new Tone.Filter(filterOpts);
    const gain = new Tone.Gain(0).connect(ambBus);
    src.connect(filt); filt.connect(gain);
    src.start();
    return { src: src, filter: filt, gain: gain };
  }

  const wind = bed("brown", { type: "lowpass", frequency: 190, Q: 0.4 });
  const hiss = bed("white", { type: "bandpass", frequency: 2300, Q: 0.6 });
  const fire = bed("brown", { type: "bandpass", frequency: 430, Q: 0.7 });

  // two oscillators a few cents apart, so the drone beats slowly against itself
  const droneFilter = new Tone.Filter({ type: "lowpass", frequency: 300 });
  const droneGain = new Tone.Gain(0).connect(ambBus);
  droneFilter.connect(droneGain);
  const droneA = new Tone.Oscillator(55, "sine").connect(droneFilter);
  const droneB = new Tone.Oscillator(55, "sine").connect(droneFilter);
  droneB.detune.value = 9;
  droneA.volume.value = -6; droneB.volume.value = -6;
  droneA.start(); droneB.start();

  // short pops, for the radio and for the fire
  const crackle = new Tone.NoiseSynth({
    noise: { type: "pink" },
    envelope: { attack: 0.001, decay: 0.03, sustain: 0 }
  });
  const crackleTone = new Tone.Filter({ type: "bandpass", frequency: 1900, Q: 1.4 }).connect(ambBus);
  crackle.connect(crackleTone);
  crackle.volume.value = -17;

  audio.nodes = {
    out, musicBus, hall, piano, bass, pad, brass,
    sfxBus, sfxHall, bell, chime, paper, knock, bang,
    ambBus, wind, hiss, fire, droneGain, droneFilter, crackle
  };

  // ---- the loop: one sequence, reading whichever movement is current ----
  audio.seq = new Tone.Sequence(function (time, i) {
    const m = SCORE[audio.movement];
    if (!m) return;
    const scale = SCALES[m.scale];
    const deg = MELODY[i];
    if (deg !== null) {
      // a little unevenness so it sounds played rather than clocked
      piano.triggerAttackRelease(midiName(degToMidi(m.root + 12, scale, deg)),
        "2n", time, 0.42 + Math.random() * 0.16);
    }
    if (i % 4 === 0) {
      const b = BASS[i / 4];
      bass.triggerAttackRelease(midiName(degToMidi(m.root - 12, scale, b)), "1n", time, 0.5);
      if (m.pad) {
        const voicing = m.pad === "hollow" ? [0, 4] : [0, 2, 4];
        pad.triggerAttackRelease(
          voicing.map(function (k) { return midiName(degToMidi(m.root, scale, b + k)); }),
          "1n", time, m.pad === "hollow" ? 0.34 : 0.3);
      }
    }
    // a low toll at the top of each cycle, like something counting the weeks
    if (m.toll && (i === 0 || i === 16)) {
      piano.triggerAttackRelease(midiName(degToMidi(m.root - 24, scale, 0)), "1n", time, 0.5);
    }
  }, Array.from({ length: MELODY.length }, function (_, i) { return i; }), "4n");

  Tone.Transport.bpm.value = SCORE.act1.bpm;
  audio.ready = true;
  return true;
}

/* ---------- music ---------- */
function musicLevel() {
  if (audio.musicMuted || !audio.movement) return 0;
  const base = SCORE[audio.movement].level;
  return audio.ducked ? base * 0.3 : base;
}
function applyMusicLevel(seconds) {
  if (!audio.ready) return;
  audio.nodes.musicBus.gain.rampTo(musicLevel(), seconds === undefined ? 0.4 : seconds);
}

function playMovement(name) {
  if (!audio.ready) return;
  const m = SCORE[name];
  if (!m) return;
  const first = audio.movement === null;
  audio.movement = name;
  // a zero-length ramp makes Tone's tick param emit a null, so set it outright
  if (first || Tone.Transport.state !== "started") {
    Tone.Transport.bpm.value = m.bpm;
  } else {
    Tone.Transport.bpm.rampTo(m.bpm, 2);
  }
  if (Tone.Transport.state !== "started") {
    audio.seq.start(0);
    Tone.Transport.start("+0.1");
  }
  applyMusicLevel(first ? 3 : 1.5);
  setMovementAmbience(name);
}

function stopMusic() {
  if (!audio.ready) return;
  audio.nodes.musicBus.gain.rampTo(0, 1.2);
  audio.movement = null;
  setMovementAmbience(null);
  setTimeout(function () {
    if (!audio.movement && audio.ready) {
      Tone.Transport.stop();
      audio.seq.stop();
    }
  }, 1400);
}

function duckMusic(on) {
  audio.ducked = !!on;
  applyMusicLevel(0.25);
}

/** radio static, then a short fanfare — the moment the New Deal arrives */
function playTransitionSting() {
  if (!audio.ready) return;
  const n = audio.nodes;
  const t = Tone.now();

  const noise = new Tone.Noise("pink").start(t);
  const band = new Tone.Filter(1700, "bandpass");
  band.Q.value = 0.9;
  const ng = new Tone.Gain(0).connect(n.sfxBus);
  noise.connect(band); band.connect(ng);
  ng.gain.setValueAtTime(0, t);
  ng.gain.linearRampToValueAtTime(0.7, t + 0.08);
  ng.gain.linearRampToValueAtTime(0.5, t + 1.0);
  ng.gain.linearRampToValueAtTime(0, t + 1.5);
  band.frequency.setValueAtTime(900, t);
  band.frequency.exponentialRampToValueAtTime(2600, t + 1.2);
  setTimeout(function () {
    noise.stop(); noise.dispose(); band.dispose(); ng.dispose();
  }, 2000);

  // the dial settles and the band strikes up, in the major to come
  const scale = SCALES.major, root = SCORE.act2.root;
  const f = t + 1.35;
  [[0, 0], [4, 0.16], [7, 0.32]].forEach(function (pair) {
    n.brass.triggerAttackRelease(midiName(degToMidi(root + 12, scale, pair[0])), 0.2, f + pair[1], 0.5);
  });
  n.brass.triggerAttackRelease(
    [0, 2, 4].map(function (k) { return midiName(degToMidi(root + 12, scale, k)); }),
    1.6, f + 0.5, 0.55);
}

const STING_LENGTH = 3000;   // static, then fanfare, before anyone speaks

/** the chord the whole thing has been heading for */
function playFinalChord() {
  if (!audio.ready) return;
  const scale = SCALES.major, root = SCORE.act2.root;
  const t = Tone.now() + 0.1;
  audio.nodes.piano.triggerAttackRelease(
    [0, 2, 4, 7].map(function (k) { return midiName(degToMidi(root, scale, k)); }),
    4, t, 0.5);
  audio.nodes.bass.triggerAttackRelease(midiName(degToMidi(root - 12, scale, 0)), 4, t, 0.6);
}

/* ---------- ambience: beds tied to what the room is doing ---------- */
const ambience = { radio: false, fire: 0 };
let radioTimer = null;
let fireTimer = null;

function ambienceAudible() { return audio.ready && !audio.musicMuted; }

/** wind and drone follow the movement; they are the grim under-layer */
function setMovementAmbience(name, seconds) {
  if (!audio.ready) return;
  const m = SCORE[name];
  const n = audio.nodes;
  // slow when a movement changes, prompt when the player hits mute
  const t = seconds === undefined ? 2.5 : seconds;
  n.wind.gain.gain.rampTo(m && ambienceAudible() ? m.wind : 0, t);
  n.droneGain.gain.rampTo(m && ambienceAudible() ? m.drone : 0, t);
  if (m) n.droneFilter.frequency.rampTo(name === "act2" ? 480 : 300, t);
}

/** the radio's own hiss and crackle, on whenever its dial is lit */
function setRadioNoise(on) {
  ambience.radio = !!on;
  clearTimeout(radioTimer); radioTimer = null;
  if (!audio.ready) return;
  audio.nodes.hiss.gain.gain.rampTo(on && ambienceAudible() ? 0.04 : 0, 0.6);
  if (!on) return;
  const pop = function () {
    if (!ambience.radio) return;
    if (ambienceAudible()) {
      audio.nodes.crackle.triggerAttackRelease(0.02, Tone.now(), 0.25 + Math.random() * 0.6);
    }
    radioTimer = setTimeout(pop, 80 + Math.random() * 540);
  };
  radioTimer = setTimeout(pop, 200);
}

/** the fire, as loud as the coal you paid for */
function setFireNoise(levelValue) {
  const v = Math.max(0, Math.min(1, Number(levelValue) || 0));
  ambience.fire = v;
  clearTimeout(fireTimer); fireTimer = null;
  if (!audio.ready) return;
  audio.nodes.fire.gain.gain.rampTo(v > 0 && ambienceAudible() ? 0.025 + 0.055 * v : 0, 0.8);
  if (v <= 0) return;
  const spit = function () {
    if (ambience.fire <= 0) return;
    if (ambienceAudible()) {
      audio.nodes.crackle.triggerAttackRelease(0.015, Tone.now(), 0.12 + Math.random() * 0.3 * ambience.fire);
    }
    fireTimer = setTimeout(spit, 180 + Math.random() * 900 / Math.max(0.3, ambience.fire));
  };
  fireTimer = setTimeout(spit, 300);
}

function refreshAmbience(seconds) {
  setMovementAmbience(audio.movement, seconds);
  setRadioNoise(ambience.radio);
  setFireNoise(ambience.fire);
}

function silenceAmbience() {
  ambience.radio = false;
  ambience.fire = 0;
  clearTimeout(radioTimer); radioTimer = null;
  clearTimeout(fireTimer); fireTimer = null;
  if (!audio.ready) return;
  const n = audio.nodes;
  [n.wind.gain, n.hiss.gain, n.fire.gain, n.droneGain].forEach(function (g) { g.gain.rampTo(0, 1); });
}

/* ---------- sound effects ---------- */
let lastCoin = 0;
const sfx = {
  coin: function () {
    if (!audio.ready || audio.musicMuted) return;
    const now = performance.now();
    if (now - lastCoin < 70) return;        // dragging a slider must not rattle
    lastCoin = now;
    const t = Tone.now();
    audio.nodes.bell.triggerAttackRelease("E7", 0.04, t, 0.3);
    audio.nodes.bell.triggerAttackRelease("B7", 0.03, t + 0.035, 0.2);
  },
  paper: function () {
    if (!audio.ready || audio.musicMuted) return;
    audio.nodes.paper.triggerAttackRelease(0.18, Tone.now(), 0.5);
  },
  knock: function () {
    if (!audio.ready || audio.musicMuted) return;
    // a fist on a door: the thud of the panel and the slap of the wood,
    // with a second hit a hair later so it lands like a real knock
    const t = Tone.now();
    const force = 0.85 + Math.random() * 0.15;
    audio.nodes.knock.triggerAttackRelease("C1", 0.3, t, force);
    audio.nodes.bang.triggerAttackRelease(0.11, t, force);
    audio.nodes.knock.triggerAttackRelease("G1", 0.18, t + 0.055, force * 0.5);
  },
  chime: function () {
    if (!audio.ready || audio.musicMuted) return;
    const t = Tone.now();
    audio.nodes.chime.triggerAttackRelease(["C6", "G6"], 1.8, t, 0.4);
  },
  stove: function () {
    if (!audio.ready || audio.musicMuted) return;
    const t = Tone.now();
    const n = new Tone.Noise("brown").start(t);
    const band = new Tone.Filter(260, "bandpass");
    band.Q.value = 1.3;
    const g = new Tone.Gain(0).connect(audio.nodes.sfxBus);
    n.connect(band); band.connect(g);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(0.42, t + 0.14);
    g.gain.linearRampToValueAtTime(0, t + 0.95);
    band.frequency.setValueAtTime(240, t);
    band.frequency.exponentialRampToValueAtTime(1700, t + 0.45);
    band.frequency.exponentialRampToValueAtTime(420, t + 0.95);
    setTimeout(function () { n.stop(); n.dispose(); band.dispose(); g.dispose(); }, 1300);
  }
};

/* ============================================================
   NARRATION  —  Web Speech API, with subtitles as the fallback
   ============================================================ */
const SPEECH_OK =
  typeof window.speechSynthesis !== "undefined" &&
  typeof window.SpeechSynthesisUtterance !== "undefined";

/* Two readers. The story is told by one; the historical record is read by
   the other, so a student can hear which is which without being told. */
const VOICE_WISHLIST = {
  // Chrome's Google voices are network-synthesised and markedly less
  // mechanical than the local ones, so they come first where they exist
  story: ["Google UK English Male", "Daniel (Enhanced)", "Daniel", "Arthur",
          "Oliver", "Microsoft George (Natural)", "Microsoft George",
          "Alex", "Tom", "Rishi", "Gordon"],
  history: ["Google UK English Female", "Serena (Enhanced)", "Serena",
            "Kate", "Stephanie", "Fiona", "Martha",
            "Microsoft Hazel (Natural)", "Microsoft Hazel",
            "Samantha", "Karen", "Moira", "Tessa"]
};

/* Weary and low for the kitchen; clearer and a touch brighter for the record.
   The jitter is what keeps a line from landing on one flat pitch. */
const VOICE_STYLE = {
  story:   { rate: 0.92, pitch: 0.86, gap: 200, jitterRate: 0.05, jitterPitch: 0.07 },
  history: { rate: 0.88, pitch: 1.06, gap: 270, jitterRate: 0.035, jitterPitch: 0.05 }
};

const VOICE = { story: null, history: null };

function resolveVoices() {
  if (!SPEECH_OK) return;
  const voices = speechSynthesis.getVoices();
  if (!voices.length) return;
  const english = voices.filter(function (v) { return /^en/i.test(v.lang); });
  const pool = english.length ? english : voices;

  const byWish = function (wishes, taken) {
    for (let i = 0; i < wishes.length; i++) {
      const hit = pool.find(function (v) { return v.name === wishes[i] && v !== taken; });
      if (hit) return hit;
    }
    return null;
  };

  VOICE.story = byWish(VOICE_WISHLIST.story, null);
  VOICE.history = byWish(VOICE_WISHLIST.history, VOICE.story);

  // nothing from the wishlist: take any two different English voices, so the
  // two readers are still distinguishable
  if (!VOICE.story) VOICE.story = pool[0] || null;
  if (!VOICE.history) {
    VOICE.history = pool.find(function (v) { return v !== VOICE.story; }) || VOICE.story;
  }
}
if (SPEECH_OK) {
  resolveVoices();
  speechSynthesis.addEventListener("voiceschanged", resolveVoices);   // Chrome fills this in late
}

/**
 * Breaks a line where a reader would breathe. Speaking one clause at a time,
 * with a beat between, is most of what stops the voice sounding like a machine
 * reading a paragraph.
 */
function phrasesOf(text) {
  const sentences = text.match(/[^.!?;:]+[.!?;:]*/g) || [text];
  const out = [];
  sentences.forEach(function (raw) {
    const part = raw.trim();
    if (!part) return;
    if (part.length <= 95) { out.push(part); return; }
    // a long sentence gets split at its last comma or dash before the middle
    let cut = -1;
    [",", " — ", " - "].forEach(function (mark) {
      const at = part.lastIndexOf(mark, Math.floor(part.length * 0.7));
      if (at > 25 && at > cut) cut = at + mark.length - 1;
    });
    if (cut > 0) {
      out.push(part.slice(0, cut + 1).trim());
      out.push(part.slice(cut + 1).trim());
    } else {
      out.push(part);
    }
  });
  return out.filter(Boolean);
}

let speechToken = 0;
let speechGuard = null;
let keepAlive = null;
let onSpeechDone = null;

/** Silences the voice without running the line's completion. */
function stopSpeech() {
  speechToken++;
  clearTimeout(speechGuard); speechGuard = null;
  clearInterval(keepAlive); keepAlive = null;
  onSpeechDone = null;
  if (SPEECH_OK) {
    try { speechSynthesis.cancel(); } catch (e) { /* nothing to cancel */ }
  }
}

/**
 * Speaks one line, clause by clause, in the voice for `role`.
 * Returns true if speech actually started, so the caller knows whether to
 * hold the player until it finishes.
 */
function speak(text, done, role) {
  if (!SPEECH_OK || audio.voiceMuted || !text) return false;
  stopSpeech();

  const style = VOICE_STYLE[role] || VOICE_STYLE.story;
  const voice = VOICE[role] || VOICE.story;
  const chunks = phrasesOf(text);
  const token = speechToken;
  let i = 0;
  let finished = false;

  const finish = function () {
    if (finished) return;
    finished = true;
    clearTimeout(speechGuard); speechGuard = null;
    clearInterval(keepAlive); keepAlive = null;
    if (token === speechToken) onSpeechDone = null;
    try { speechSynthesis.cancel(); } catch (e) { /* already quiet */ }
    if (done) done();
  };

  const next = function () {
    if (finished || token !== speechToken) return;
    if (i >= chunks.length) { finish(); return; }
    const u = new SpeechSynthesisUtterance(chunks[i]);
    if (voice) u.voice = voice;
    // a little drift either side of the base, so no two clauses sit on the
    // same note; later clauses settle slightly, the way a sentence falls
    const settle = chunks.length > 1 ? (i / (chunks.length - 1)) * 0.05 : 0;
    u.rate = style.rate + (Math.random() - 0.5) * style.jitterRate;
    u.pitch = Math.max(0.1, style.pitch - settle + (Math.random() - 0.5) * style.jitterPitch);
    u.volume = 1;
    u.onend = function () { i++; setTimeout(next, style.gap); };
    u.onerror = function () { i++; setTimeout(next, style.gap); };
    speechSynthesis.speak(u);
  };

  onSpeechDone = finish;
  audio.lastSpoken = { role: role || "story", voice: voice ? voice.name : null };

  // Chrome stops speaking after ~15s unless it is nudged
  keepAlive = setInterval(function () {
    if (!speechSynthesis.speaking) return;
    speechSynthesis.pause();
    speechSynthesis.resume();
  }, 9000);

  // and sometimes never fires onend at all, so cap the whole line by length
  const perChunkGap = style.gap * chunks.length;
  const estimate = 3000 + perChunkGap + (text.length / 11) * 1000 / style.rate;
  speechGuard = setTimeout(finish, estimate);

  next();
  return true;
}

/* ============================================================
   ACT ONE
   A small state machine over LESSON. Nothing below reads a
   number or a line of text that is not in that object.
   ============================================================ */

const $ = function (sel) { return document.querySelector(sel); };

const el = {
  topbar:     $("#topbar"),
  week:       $("#uiWeek"),
  weekLabel:  $("#uiWeekLabel"),
  cash:       $("#uiCash"),
  cashLabel:  $("#uiCashLabel"),
  well:       $("#uiWell"),
  wellLabel:  $("#uiWellLabel"),
  wellFill:   $("#uiWellFill"),
  muteMusic:  $("#btnMuteMusic"),
  muteVoice:  $("#btnMuteVoice"),
  skip:       $("#btnSkip"),

  clipping:   $("#clipping"),
  budget:     $("#budget"),
  needRows:   $("#needRows"),
  unassigned: $("#uiUnassigned"),
  endWeek:    $("#btnEndWeek"),

  result:     $("#result"),
  resultNext: $("#btnResultNext"),

  subtitle:   $("#subtitle"),
  line:       $("#subtitle .line"),
  tag:        $("#subtitle .tag"),
  advance:    $("#advance"),

  title:      $("#title"),
  begin:      $("#btnBegin"),
  intro:      $("#intro"),
  crisis:     $("#crisis"),
  transition: $("#transition"),
  act2:       $("#act2"),
  posters:    $("#posters"),
  ending:     $("#ending"),
  playAgain:  $("#btnPlayAgain")
};

const GAME = {
  phase: "title",      // title | intro | beats | budget | result | crisis | transition
  weekIndex: -1,
  cash: 0,
  wellbeing: LESSON.wellbeing.start,
  savings: 0,
  rentMissed: 0,
  alloc: {},
  picks: [],
  speaking: false,
  hintOpts: null,
  beats: [],
  beatIndex: 0,
  onAdvance: null
};

const NEEDS = LESSON.needs;
const WEEKS = LESSON.act1.weeks;
const money = function (n) { return "$" + n; };
const currentWeek = function () { return WEEKS[GAME.weekIndex]; };

/* ---------- typed narration ---------- */
let typeTimer = null;
let typeFull = "";
const TYPE_CPS = 95;   // characters a second

function narrate(text, opts) {
  opts = opts || {};
  clearInterval(typeTimer);
  typeFull = text;
  const role = opts.voice === "history" ? "history" : "story";
  el.line.className = "line" + (opts.fact ? " fact" : "");
  el.tag.textContent = role === "history" ? LESSON.ui.fromTheRecord : "";
  el.tag.style.display = role === "history" ? "" : "none";
  el.subtitle.classList.add("on");

  // the line is spoken as well as written; while it is speaking the player
  // is held, exactly as a narrator holds a room
  GAME.speaking = speak(text, function () {
    GAME.speaking = false;
    duckMusic(false);
    finishTyping();
    setAdvanceHint(opts);
    renderAudioButtons();
  }, role);
  duckMusic(GAME.speaking);
  setAdvanceHint(opts);
  GAME.hintOpts = opts;
  renderAudioButtons();
  // driven off the clock, not off tick count, so a throttled timer still
  // lands on the right character
  const t0 = performance.now();
  el.line.textContent = "";
  typeTimer = setInterval(function () {
    const n = Math.floor((performance.now() - t0) / 1000 * TYPE_CPS);
    el.line.textContent = text.slice(0, n);
    if (n >= text.length) { clearInterval(typeTimer); el.line.textContent = text; }
  }, 16);
}
/** speaks a line that is displayed somewhere other than the subtitle bar */
function sayOnOverlay(node, text) {
  node.textContent = text;
  GAME.speaking = speak(text, function () {
    GAME.speaking = false;
    duckMusic(false);
    renderAudioButtons();
  }, "story");
  duckMusic(GAME.speaking);
  renderAudioButtons();
}

function setAdvanceHint(opts) {
  if (opts && opts.hint === false && !GAME.speaking) { el.advance.textContent = ""; return; }
  el.advance.textContent = GAME.speaking ? LESSON.ui.skipHint : LESSON.ui.clickHint;
}

function finishTyping() {
  if (!typeFull) return false;
  if (el.line.textContent === typeFull) return false;
  clearInterval(typeTimer);
  el.line.textContent = typeFull;
  return true;
}
function hideNarration() {
  clearInterval(typeTimer);
  stopSpeech();
  GAME.speaking = false;
  duckMusic(false);
  typeFull = "";
  el.subtitle.classList.remove("on");
}

/* ---------- top bar ---------- */
function flash(node) {
  node.classList.remove("flash");
  void node.offsetWidth;
  node.classList.add("flash");
}

function renderTopbar(flashWhat) {
  el.weekLabel.textContent = LESSON.ui.week;
  el.cashLabel.textContent = LESSON.ui.cash;
  el.wellLabel.textContent = LESSON.wellbeing.label;
  el.week.textContent = GAME.weekIndex < 0
    ? "–"
    : (GAME.weekIndex + 1) + " / " + WEEKS.length;
  el.cash.textContent = money(GAME.cash);

  const w = GAME.wellbeing;
  const span = LESSON.wellbeing.max - LESSON.wellbeing.min;
  el.well.textContent = String(w);
  el.wellFill.style.width = ((w - LESSON.wellbeing.min) / span * 100) + "%";
  // green through amber to red as the family comes apart
  const hue = Math.round(95 * (w / LESSON.wellbeing.max));
  const sat = 26 + Math.round(26 * (1 - w / LESSON.wellbeing.max));
  el.wellFill.style.backgroundColor = "hsl(" + hue + "," + sat + "%,38%)";

  if (flashWhat === "cash") flash(el.cash);
  if (flashWhat === "well") flash(el.well);
}

/* ---------- budget ledger ---------- */
function allocTotal() {
  return NEEDS.reduce(function (sum, n) { return sum + GAME.alloc[n.key]; }, 0)
    + GAME.alloc.savings;
}
function unassigned() { return GAME.cash - allocTotal(); }

function buildLedger() {
  const week = currentWeek();
  el.budget.querySelector("h2").textContent = LESSON.ui.budgetTitle;
  el.budget.querySelector(".note").textContent = LESSON.ui.budgetNote;
  el.budget.querySelector(".totals .left").textContent = LESSON.ui.unassigned;
  el.endWeek.textContent = LESSON.ui.endWeek;
  el.needRows.innerHTML = "";

  const rows = NEEDS.map(function (need) {
    return {
      key: need.key, label: need.label, cost: need.cost,
      hint: need.hint, allOrNothing: need.allOrNothing
    };
  });
  if (week.savingsAllowed) {
    rows.push({
      key: "savings", label: LESSON.savings.label,
      cost: LESSON.savings.max, hint: LESSON.savings.hint, isSavings: true
    });
  }

  rows.forEach(function (row) {
    const div = document.createElement("div");
    div.className = "need";
    div.dataset.key = row.key;
    div.innerHTML =
      '<div class="top"><span class="name"></span><span class="amt"></span></div>' +
      '<div class="sub"><span class="hint"></span><span class="eff"></span></div>' +
      '<input type="range" min="0">';
    div.querySelector(".name").textContent = row.label;
    div.querySelector(".hint").textContent = row.hint;
    const input = div.querySelector("input");
    input.max = row.cost;
    // an all-or-nothing need stops only at nothing or all
    input.step = row.allOrNothing ? row.cost : 1;
    input.value = GAME.alloc[row.key];
    input.addEventListener("input", function () {
      setAlloc(row.key, Number(input.value));
    });
    el.needRows.appendChild(div);
  });
  renderLedger();
}

function setAlloc(key, value) {
  const cap = key === "savings"
    ? LESSON.savings.max
    : NEEDS.find(function (n) { return n.key === key; }).cost;
  value = Math.max(0, Math.min(cap, Math.round(value)));
  // never let the household spend money it does not have
  const others = allocTotal() - GAME.alloc[key];
  const settled = Math.min(value, GAME.cash - others);
  if (settled !== GAME.alloc[key]) sfx.coin();
  GAME.alloc[key] = settled;
  renderLedger();
}

function renderLedger() {
  const week = currentWeek();
  el.needRows.querySelectorAll(".need").forEach(function (div) {
    const key = div.dataset.key;
    const isSavings = key === "savings";
    const cap = isSavings
      ? LESSON.savings.max
      : NEEDS.find(function (n) { return n.key === key; }).cost;
    const got = GAME.alloc[key];
    div.querySelector("input").value = got;
    div.querySelector(".amt").textContent = money(got) + " / " + money(cap);
    let chip = div.querySelector(".chip");
    const eff = div.querySelector(".eff");
    if (isSavings) {
      if (chip) chip.remove();
      eff.textContent = "";
      eff.className = "eff";
    } else {
      if (!chip) {
        chip = document.createElement("span");
        chip.className = "chip";
        div.querySelector(".name").appendChild(chip);
      }
      const need = NEEDS.find(function (n) { return n.key === key; });
      const res = scoreNeed(need, got);
      chip.className = "chip " + (res.state === "full" ? "ok" : "bad");
      chip.textContent = res.state === "full"
        ? LESSON.ui.paid
        : LESSON.ui.short + " " + money(cap - got);
      // the arithmetic, visible before you commit to it
      eff.textContent = signed(res.delta);
      eff.className = "eff " + (res.delta > 0 ? "ok" : "bad");
    }
  });
  el.unassigned.textContent = money(unassigned());
  // the room answers the ledger while the player is still deciding
  setFood(GAME.alloc.food / needCost("food"));
  lightStove(GAME.alloc.heat / needCost("heat"));
  setJarCoins(week.savingsAllowed ? GAME.alloc.savings / LESSON.savings.max
                                  : GAME.savings / LESSON.savings.max);
}

/**
 * What a week's payment buys you.
 *   full    — the need is met, you get the bonus
 *   partial — you bought some of it; the penalty shrinks with the shortfall
 *   none    — nothing paid, or an all-or-nothing need left short
 * Rent is all-or-nothing, so its slider only stops at $0 or the full amount
 * and no money can be sunk into it for nothing.
 */
function scoreNeed(need, got) {
  if (got >= need.cost) return { state: "full", delta: need.bonus };
  if (got <= 0 || need.allOrNothing) return { state: "none", delta: -need.penalty };
  const shortfall = (need.cost - got) / need.cost;
  return { state: "partial", delta: -Math.max(1, Math.round(need.penalty * shortfall)) };
}

function outcomeLine(need, result) {
  if (result.state === "full") return need.paidLine;
  if (result.state === "partial" && need.partialLine) return need.partialLine;
  return need.unpaidLine;
}

function signed(n) { return (n > 0 ? "+" : "") + n; }

/* content can offer variants; the first one whose condition holds wins */
const CONDITIONS = {
  rentOwed:  function () { return GAME.rentMissed > 0; },
  rentClear: function () { return GAME.rentMissed === 0; }
};
function condPasses(cond) {
  if (!cond) return true;
  return CONDITIONS[cond] ? CONDITIONS[cond]() : true;
}
function pickVariant(v) {
  if (!Array.isArray(v)) return v;
  return v.find(function (x) { return condPasses(x.cond); });
}

/** setRadioGlow, plus the hiss and crackle of a live set */
function radioOn(on) {
  setRadioNoise(on);
  return setRadioGlow(on);
}

/** setStoveLit, plus the whoosh the first time it catches */
let heatWas = 0;
function lightStove(v) {
  if (v > 0 && heatWas === 0) sfx.stove();
  heatWas = v;
  setFireNoise(v);
  return setStoveLit(v);
}

function needCost(key) {
  return NEEDS.find(function (n) { return n.key === key; }).cost;
}

/** clicking the door, table or stove pays that need in full if the money is there */
function payFromRoom(objectName) {
  const need = NEEDS.find(function (n) { return n.object === objectName; });
  if (!need) return;
  const current = GAME.alloc[need.key];
  const target = current >= need.cost ? 0 : need.cost;
  setAlloc(need.key, target);
  focusCamera(objectName);
  clearTimeout(payFromRoom.release);
  payFromRoom.release = setTimeout(function () {
    if (GAME.phase === "budget") focusCamera(null);
  }, 2200);
  const row = el.needRows.querySelector('[data-key="' + need.key + '"]');
  if (row) {
    el.needRows.querySelectorAll(".need").forEach(function (d) { d.classList.remove("focus"); });
    row.classList.add("focus");
  }
}

/* ---------- jar animation ---------- */
function animateJar(from, to, ms, done) {
  const t0 = performance.now();
  (function step(now) {
    const k = Math.min(1, (now - t0) / ms);
    // coins fall out in little lurches rather than a smooth drain
    const eased = k < 1 ? k + 0.04 * Math.sin(k * 22) * (1 - k) : 1;
    setJarCoins(from + (to - from) * eased);
    if (k < 1) requestAnimationFrame(step);
    else if (done) done();
  })(t0);
}

/* ---------- beats ---------- */
const BEAT_ACTIONS = {
  emptyJar: function () {
    const from = GAME.savings / LESSON.savings.max;
    GAME.savings = 0;
    animateJar(from, 0, 1600);
    [0, 260, 520, 820].forEach(function (d) { setTimeout(sfx.coin, d); });
  },
  knock: function () {
    // three knocks, slow and even — felt as a jolt through the room
    let n = 0;
    const id = setInterval(function () {
      shakeCamera(0.055);
      sfx.knock();
      if (++n >= 3) clearInterval(id);
    }, 420);
  }
};

function runBeats(beats, done) {
  GAME.phase = "beats";
  GAME.beats = beats.slice();
  GAME.beatIndex = -1;
  GAME.onAdvance = function () { nextBeat(done); };
  nextBeat(done);
}

function nextBeat(done) {
  GAME.beatIndex++;
  if (GAME.beatIndex >= GAME.beats.length) {
    GAME.onAdvance = null;
    hideNarration();
    done();
    return;
  }
  const beat = GAME.beats[GAME.beatIndex];
  if (beat.focus) focusCamera(beat.focus);
  if (beat.radio !== undefined) radioOn(!!beat.radio);
  if (beat.action && BEAT_ACTIONS[beat.action]) BEAT_ACTIONS[beat.action]();
  narrate(beat.line, { fact: beat.fact });
}

/* ---------- the week ---------- */
function startWeek(index) {
  GAME.weekIndex = index;
  const week = WEEKS[index];

  GAME.alloc = { savings: 0 };
  NEEDS.forEach(function (n) { GAME.alloc[n.key] = 0; });

  GAME.cash += week.income;
  renderTopbar("cash");
  focusCamera(null);
  radioOn(false);

  narrate(week.incomeLine, { hint: false });
  const beats = week.beats.filter(function (b) { return condPasses(b.cond); });
  showClipping(pickVariant(week.clipping), function () {
    runBeats(beats, openBudget);
  });
}

function showClipping(clip, done) {
  el.clipping.querySelector(".kicker").textContent = clip.kicker;
  el.clipping.querySelector("h3").textContent = clip.headline;
  el.clipping.querySelector(".body").textContent = clip.body;
  el.clipping.querySelector(".dateline").textContent = clip.dateline;
  el.clipping.classList.remove("on");
  void el.clipping.offsetWidth;
  el.clipping.classList.add("on");
  sfx.paper();
  GAME.phase = "beats";
  GAME.onAdvance = function () { GAME.onAdvance = null; done(); };
  el.advance.textContent = LESSON.ui.clickHint;
  el.subtitle.classList.add("on");
}

function openBudget() {
  GAME.phase = "budget";
  GAME.onAdvance = null;
  hideNarration();
  radioOn(false);
  focusCamera(null);          // back to the orbit, so every object is reachable
  document.body.classList.add("budgeting");
  buildLedger();
  el.budget.classList.add("on");
  sfx.paper();
}

function endWeek() {
  GAME.phase = "result";
  document.body.classList.remove("budgeting");
  el.budget.classList.remove("on");
  el.clipping.classList.remove("on");
  el.needRows.querySelectorAll(".need").forEach(function (d) { d.classList.remove("focus"); });

  const week = currentWeek();
  const spent = allocTotal();
  GAME.cash -= spent;
  GAME.savings += GAME.alloc.savings;

  let swing = 0;
  const outcomes = NEEDS.map(function (need) {
    const got = GAME.alloc[need.key];
    const res = scoreNeed(need, got);
    swing += res.delta;
    return { need: need, got: got, state: res.state, met: res.state === "full", delta: res.delta };
  });

  // rent in arrears is a running state, not a one-week event
  const rent = outcomes.find(function (o) { return o.need.key === "rent"; });
  if (rent && !rent.met) GAME.rentMissed++;

  // report the change that was actually applied, not the one the clamp ate
  const before = GAME.wellbeing;
  GAME.wellbeing = Math.max(
    LESSON.wellbeing.min,
    Math.min(LESSON.wellbeing.max, before + swing)
  );
  const applied = GAME.wellbeing - before;

  // the room now shows the week the family actually had
  setFood(GAME.alloc.food / needCost("food"));
  lightStove(GAME.alloc.heat / needCost("heat"));
  setEvictionNotice(GAME.rentMissed > 0);
  setJarCoins(GAME.savings / LESSON.savings.max);
  focusCamera(firstUnmet(outcomes));

  renderTopbar("well");
  showResult(week, outcomes, swing, applied);
}

function firstUnmet(outcomes) {
  const miss = outcomes.find(function (o) { return !o.met; });
  return miss ? miss.need.object : null;
}

function showResult(week, outcomes, swing, applied) {
  el.result.querySelector("h2").textContent = LESSON.ui.resultTitle;
  el.result.querySelector(".week").textContent = LESSON.ui.week + " " + week.n;
  const ul = el.result.querySelector("ul");
  ul.innerHTML = "";
  outcomes.forEach(function (o) {
    const li = document.createElement("li");
    li.className = o.state === "full" ? "ok" : (o.state === "partial" ? "part" : "bad");
    li.innerHTML = '<span class="mark"></span><span class="txt"></span><span class="delta"></span>';
    li.querySelector(".mark").textContent =
      o.state === "full" ? "✓" : (o.state === "partial" ? "–" : "✗");
    li.querySelector(".txt").textContent = outcomeLine(o.need, o);
    li.querySelector(".delta").textContent = signed(o.delta);
    ul.appendChild(li);
  });
  // paying this week does not wipe out what is already owed
  const rentOut = outcomes.find(function (o) { return o.need.key === "rent"; });
  if (GAME.rentMissed > 0 && rentOut && rentOut.met) {
    const li = document.createElement("li");
    li.className = "bad";
    li.innerHTML = '<span class="mark"></span><span class="txt"></span>';
    li.querySelector(".mark").textContent = "!";
    li.querySelector(".txt").textContent = LESSON.ui.arrears;
    ul.appendChild(li);
  }

  // if the clamp swallowed part of the swing, say so rather than printing a lie
  let swingText = GAME.wellbeing + "  (" + signed(applied) + ")";
  if (applied !== swing) {
    swingText += "  · " + (applied > swing ? LESSON.ui.atFloor : LESSON.ui.atCeiling);
  }
  el.result.querySelector(".swing .val").textContent = swingText;
  sfx.paper();
  el.resultNext.textContent = LESSON.ui.continueLabel;
  el.result.classList.add("on");
}

function afterResult() {
  el.result.classList.remove("on");
  if (GAME.weekIndex < WEEKS.length - 1) {
    startWeek(GAME.weekIndex + 1);
  } else {
    endAct();
  }
}

function endAct() {
  focusCamera(null);
  if (GAME.wellbeing < LESSON.wellbeing.crisis) {
    runCrisis(function () { startTransition(); });
  } else {
    narrate(LESSON.act1.closing, { fact: true });
    GAME.phase = "beats";
    GAME.onAdvance = function () { GAME.onAdvance = null; hideNarration(); startTransition(); };
  }
}

/* ---------- Hooverville ---------- */
function runCrisis(done) {
  GAME.phase = "crisis";
  const scene = LESSON.act1.crisisScene;
  // the kitchen goes dark and cold behind the fade
  setStoveLit(false);
  setFood(false);
  setJarCoins(0);
  hideNarration();

  el.crisis.querySelector(".cap").textContent = scene.title;
  const textEl = el.crisis.querySelector(".text");
  el.crisis.classList.add("on");
  void el.crisis.offsetWidth;
  el.crisis.classList.add("vis");

  let i = 0;
  sayOnOverlay(textEl, scene.lines[0]);
  GAME.onAdvance = function () {
    i++;
    if (i < scene.lines.length) {
      sayOnOverlay(textEl, scene.lines[i]);
    } else {
      GAME.onAdvance = null;
      el.crisis.classList.remove("vis");
      setTimeout(function () { el.crisis.classList.remove("on"); done(); }, 1400);
    }
  };
}

/* ============================================================
   TRANSITION  —  the fireside chat
   ============================================================ */
function startTransition() {
  GAME.phase = "transition";
  GAME.onAdvance = null;
  document.body.classList.remove("budgeting");
  hideNarration();
  el.budget.classList.remove("on");
  el.result.classList.remove("on");
  el.clipping.classList.remove("on");

  radioOn(true);
  focusCamera("radio");
  stopMusic();
  playTransitionSting();

  const T = LESSON.transition;
  let i = 0;
  const showCard = function () {
    hideNarration();
    el.transition.querySelector(".over").textContent = T.card.over;
    el.transition.querySelector("h2").textContent = T.card.name;
    el.transition.querySelector("p").textContent = T.card.under;
    el.transition.classList.add("on");
    GAME.onAdvance = function () {
      GAME.onAdvance = null;
      el.transition.classList.remove("on");
      startAct2();
    };
  };

  const nextLine = function () {
    i++;
    if (i < T.lines.length) { narrate(T.lines[i]); return; }
    showCard();
  };

  // let the dial hiss and the band finish before the voice comes in
  GAME.onAdvance = null;
  setTimeout(function () {
    if (GAME.phase !== "transition") return;
    narrate(T.lines[0]);
    GAME.onAdvance = nextLine;
  }, STING_LENGTH);
}
window.startTransition = startTransition;

/* ============================================================
   ACT TWO  —  choose three programmes
   ============================================================ */
const PROGRAMS = LESSON.act2.programs;

const PROGRAM_EFFECTS = {
  refillJar: function () {
    animateJar(0, 1, 1700);
    [0, 320, 640, 980].forEach(function (d) { setTimeout(sfx.coin, d); });
  },
  food: function () { setFood(true); },
  heat: function () { lightStove(1); },
  chair: function () { setRockingChair(true); },
  none: function () {}
};

function startAct2() {
  GAME.phase = "act2";
  GAME.picks = [];
  el.topbar.classList.add("on");
  // 1932 as the family left it: the room has to be earned back
  setFood(false);
  setStoveLit(false);
  setJarCoins(0);
  setRockingChair(false);
  setRoomWarmth(0);
  radioOn(true);
  focusCamera(null);
  playMovement("act2");
  buildPosters();
  openAct2();
}

function buildPosters() {
  const A = LESSON.act2;
  el.act2.querySelector("h2").textContent = A.heading;
  el.act2.querySelector(".instruction").textContent = A.instruction;
  el.posters.innerHTML = "";

  PROGRAMS.forEach(function (prog) {
    const b = document.createElement("button");
    b.className = "poster";
    b.dataset.key = prog.key;
    b.style.setProperty("--pc", prog.colour);
    b.innerHTML =
      '<span class="stamp"></span>' +
      '<span class="art"></span>' +
      '<span class="short"></span>' +
      '<span class="name"></span>' +
      '<span class="year"></span>' +
      '<span class="desc"></span>' +
      '<span class="target"></span>';
    b.querySelector(".art").innerHTML = prog.art;
    b.querySelector(".short").textContent = prog.short;
    b.querySelector(".name").textContent = prog.name;
    b.querySelector(".year").textContent = prog.year;
    b.querySelector(".desc").textContent = prog.desc;
    b.querySelector(".target").textContent = A.problems[prog.problem];
    b.querySelector(".stamp").textContent = A.counter;
    b.addEventListener("click", function (e) {
      e.stopPropagation();
      choose(prog);
    });
    el.posters.appendChild(b);
  });
  renderPosters();
}

function renderPosters() {
  const A = LESSON.act2;
  el.act2.querySelector(".count").textContent =
    A.counter + " " + GAME.picks.length + " / " + A.pickCount;
  el.posters.querySelectorAll(".poster").forEach(function (b) {
    const taken = GAME.picks.indexOf(b.dataset.key) !== -1;
    b.classList.toggle("chosen", taken);
    b.disabled = taken;
  });
}

function openAct2() {
  GAME.phase = "act2";
  GAME.onAdvance = null;
  hideNarration();
  renderPosters();
  el.act2.classList.add("on");
  sfx.paper();
}

function choose(prog) {
  if (GAME.picks.length >= LESSON.act2.pickCount) return;
  if (GAME.picks.indexOf(prog.key) !== -1) return;
  GAME.picks.push(prog.key);

  el.act2.classList.remove("on");
  GAME.phase = "reveal";

  // the room answers the programme
  sfx.chime();
  if (PROGRAM_EFFECTS[prog.effect]) PROGRAM_EFFECTS[prog.effect]();
  setRoomWarmth(warmthFromPicks());
  focusCamera(prog.focus || null);

  narrate(prog.reveal, { fact: true, voice: "history" });
  GAME.onAdvance = function () {
    GAME.onAdvance = null;
    hideNarration();
    focusCamera(null);
    if (GAME.picks.length >= LESSON.act2.pickCount) showEnding();
    else openAct2();
  };
}

/** only the programmes that actually reach this kitchen warm it */
function warmthFromPicks() {
  const helped = GAME.picks.filter(function (k) {
    const prog = PROGRAMS.find(function (p) { return p.key === k; });
    return prog && prog.effect !== "none";
  }).length;
  return helped / LESSON.act2.pickCount;
}

/* ============================================================
   ENDING
   ============================================================ */
function showEnding() {
  GAME.phase = "ending";
  GAME.onAdvance = null;
  hideNarration();
  radioOn(false);
  focusCamera(null);
  stopMusic();
  playFinalChord();

  const E = LESSON.ending;
  const card = el.ending.querySelector(".card");
  card.querySelector("h2").textContent = E.title;
  card.querySelector(".lead").textContent = E.lead;
  card.querySelector('[data-k="wellbeing"]').textContent = E.wellbeingLabel;
  card.querySelector('[data-k="problems"]').textContent = E.problemsLabel;
  card.querySelector('[data-k="lasted"]').textContent = E.lastedLabel;
  card.querySelector('[data-k="reflection"]').textContent = E.reflectionLabel;
  card.querySelector(".lasted").textContent = E.lasted;
  card.querySelector(".q").textContent = E.reflection;
  card.querySelector("textarea").placeholder = E.reflectionPlaceholder;
  el.playAgain.textContent = E.playAgain;

  card.querySelector(".wb .num").textContent = GAME.wellbeing;
  const band = E.bands.find(function (b) { return GAME.wellbeing >= b.min; });
  card.querySelector(".wb .band").textContent = band ? band.text : "";

  // every problem of 1932, and what the player did about it
  const chosen = GAME.picks.map(function (k) {
    return PROGRAMS.find(function (p) { return p.key === k; });
  });
  const ul = card.querySelector("ul");
  ul.innerHTML = "";
  Object.keys(LESSON.act2.problems).forEach(function (key) {
    const taken = chosen.filter(function (p) { return p.problem === key; });
    const solved = taken.some(function (p) { return p.solves; });
    const struck = taken.length > 0 && !solved;
    const li = document.createElement("li");
    li.className = solved ? "ok" : (struck ? "struck" : "no");
    li.innerHTML = '<span class="mark"></span><span class="txt"></span><span class="via"></span>';
    li.querySelector(".mark").textContent = solved ? "✓" : "✗";
    li.querySelector(".txt").textContent = LESSON.act2.problems[key];
    li.querySelector(".via").textContent = taken.length
      ? taken.map(function (p) { return p.short; }).join(", ") +
        " · " + (solved ? E.solvedMark : E.struckMark)
      : E.unsolvedMark;
    ul.appendChild(li);
  });

  el.ending.classList.add("on");
}

/* ---------- play again ---------- */
function resetGame() {
  GAME.phase = "title";
  GAME.weekIndex = -1;
  GAME.cash = 0;
  GAME.wellbeing = LESSON.wellbeing.start;
  GAME.savings = 0;
  GAME.rentMissed = 0;
  GAME.alloc = {};
  GAME.picks = [];
  GAME.beats = [];
  GAME.onAdvance = null;

  hideNarration();
  stopSpeech();
  stopMusic();
  silenceAmbience();
  heatWas = 0;
  document.body.classList.remove("budgeting");
  [el.topbar, el.budget, el.result, el.clipping, el.act2,
   el.ending, el.transition].forEach(function (n) { n.classList.remove("on"); });
  el.crisis.classList.remove("on", "vis");
  el.intro.classList.remove("on");
  el.ending.querySelector("textarea").value = "";

  // the kitchen as it stands at the title card
  setFood(true);
  setStoveLit(true);
  setJarCoins(0);
  setEvictionNotice(false);
  radioOn(false);
  setRockingChair(false);
  setRoomWarmth(0);
  focusCamera(null);

  renderTopbar();
  renderAudioButtons();
  el.title.classList.remove("gone");
}

/* ---------- title and intro ---------- */
function showTitle() {
  el.title.querySelector("h1").textContent = LESSON.title.name;
  el.title.querySelector(".year").textContent = LESSON.title.year;
  el.title.querySelector(".sub").textContent = LESSON.title.subtitle;
  el.title.querySelector(".subject").textContent = LESSON.subject;
  el.begin.textContent = LESSON.title.begin;
  renderTopbar();
}

/* highlights a cited word in an intro line and attaches its source card */
function addCitations(p, lineIndex) {
  (LESSON.citations || []).filter(function (c) { return c.line === lineIndex; }).forEach(function (c, n) {
    const text = p.firstChild;
    if (!text || text.nodeType !== 3) return;
    const at = text.data.indexOf(c.word);
    if (at < 0) return;
    const word = text.splitText(at);
    word.splitText(c.word.length);
    const id = "cite-" + lineIndex + "-" + n;
    const mark = document.createElement("span");
    mark.className = "cite";
    mark.tabIndex = 0;
    mark.setAttribute("aria-describedby", id);
    const link = c.url
      ? '<a href="' + c.url + '" target="_blank" rel="noopener">Open the source</a>'
      : "Source for this line";
    mark.innerHTML = c.word +
      '<span class="cite-card" role="tooltip" id="' + id + '">' +
        '<span class="pdf-page">' +
          '<span class="pdf-badge">PDF</span>' +
          '<span class="pdf-kicker"></span><span class="pdf-title"></span><span class="pdf-section"></span>' +
          '<span class="pdf-lines" aria-hidden="true"><i></i><i></i><i></i><i></i></span>' +
        '</span>' +
        '<span class="pdf-foot">' + link + '</span>' +
      '</span>';
    mark.querySelector(".pdf-kicker").textContent = c.publisher;
    mark.querySelector(".pdf-title").textContent = c.title;
    mark.querySelector(".pdf-section").textContent = c.section;
    // reading the source shouldn't move the story on
    mark.addEventListener("click", function (e) { e.stopPropagation(); });
    word.replaceWith(mark);
  });
}

function runIntro() {
  GAME.phase = "intro";
  el.intro.classList.add("on");
  const p = el.intro.querySelector("p");
  let i = 0;
  sayOnOverlay(p, LESSON.intro[0]);
  addCitations(p, 0);
  GAME.onAdvance = function () {
    i++;
    if (i < LESSON.intro.length) {
      p.style.opacity = 0;
      setTimeout(function () { sayOnOverlay(p, LESSON.intro[i]); addCitations(p, i); p.style.opacity = 1; }, 180);
    } else {
      GAME.onAdvance = null;
      el.intro.classList.remove("on");
      el.topbar.classList.add("on");
      GAME.cash = 0;
      GAME.wellbeing = LESSON.wellbeing.start;
      GAME.savings = 0;
      GAME.rentMissed = 0;
      setFood(false);
      setStoveLit(false);
      setJarCoins(0);
      setEvictionNotice(false);
      startWeek(0);
    }
  };
  p.style.transition = "opacity 180ms ease";
}

/* ---------- input ---------- */
function advance() {
  if (GAME.speaking) return;        // held until the line ends, or Skip
  if (finishTyping()) return;
  if (GAME.onAdvance) GAME.onAdvance();
}

/** Skip cuts the current line short; with nothing being spoken it moves on. */
function skipAhead() {
  if (GAME.speaking) {
    const cb = onSpeechDone;
    if (cb) {
      cb();                         // cancels the voice and runs its completion
    } else {
      stopSpeech();
      GAME.speaking = false;
      duckMusic(false);
      finishTyping();
      setAdvanceHint(GAME.hintOpts);
    }
    renderAudioButtons();
    return;
  }
  if (finishTyping()) return;
  if (GAME.onAdvance) GAME.onAdvance();
}

el.begin.addEventListener("click", async function (e) {
  e.stopPropagation();
  el.title.classList.add("gone");
  // browsers only allow audio to start from a gesture, so this is the moment
  await initAudio();
  renderAudioButtons();
  playMovement("act1");
  setTimeout(runIntro, 700);
});
el.intro.addEventListener("click", advance);
el.crisis.addEventListener("click", advance);
el.transition.addEventListener("click", advance);
el.clipping.addEventListener("click", advance);
el.subtitle.addEventListener("click", advance);
el.endWeek.addEventListener("click", function (e) { e.stopPropagation(); endWeek(); });
el.resultNext.addEventListener("click", function (e) { e.stopPropagation(); afterResult(); });
el.playAgain.addEventListener("click", function (e) { e.stopPropagation(); resetGame(); });

function renderAudioButtons() {
  el.muteMusic.textContent = LESSON.ui.music;
  el.muteVoice.textContent = LESSON.ui.voice;
  el.skip.textContent = LESSON.ui.skip;
  el.muteMusic.classList.toggle("off", audio.musicMuted);
  el.muteVoice.classList.toggle("off", audio.voiceMuted);
  el.skip.classList.toggle("hot", !!GAME.speaking);
  if (!SPEECH_OK) {
    el.muteVoice.disabled = true;
    el.muteVoice.title = "No speech voice available in this browser";
  }
}

el.muteMusic.addEventListener("click", function (e) {
  e.stopPropagation();
  audio.musicMuted = !audio.musicMuted;
  applyMusicLevel(0.3);
  refreshAmbience(0.4);
  renderAudioButtons();
});

el.muteVoice.addEventListener("click", function (e) {
  e.stopPropagation();
  audio.voiceMuted = !audio.voiceMuted;
  if (audio.voiceMuted && GAME.speaking) skipAhead();   // never strand the player
  renderAudioButtons();
});

el.skip.addEventListener("click", function (e) {
  e.stopPropagation();
  skipAhead();
});

// clicking in the room: pay a need during the budget, advance otherwise
const ADVANCING_PHASES = ["intro", "beats", "reveal", "crisis", "transition"];
onRoomClick = function (key) {
  if (GAME.phase === "budget") payFromRoom(key);
  else if (ADVANCING_PHASES.indexOf(GAME.phase) !== -1) advance();
};
onEmptyClick = function () {
  if (ADVANCING_PHASES.indexOf(GAME.phase) !== -1) advance();
};

document.addEventListener("keydown", function (e) {
  if (e.key === "d" || e.key === "D") {
    el.title.classList.add("gone");
    el.intro.classList.remove("on");
    el.topbar.classList.add("on");
    startTransition();
  }
});

showTitle();
renderAudioButtons();

console.log(
  "%cHard Times: 1932 — room ready.",
  "font-weight:bold"
);
console.log("Helpers: setFood(bool), setStoveLit(bool), setJarCoins(0-1), setEvictionNotice(bool), setRadioGlow(bool), focusCamera(name|null)");
console.log("Debug keys: D jumps to the act transition, G toggles the room-state panel.");
</script>
</body>
</html>
